<article class="post-article">
  <a class="back-link" href="../../index.html">&larr; All posts</a>
  <header class="article-header">
    <div class="post-meta">
      <time datetime="{{post_date_iso}}">{{post_date}}</time>
      <span>&middot;</span>
      <span>{{reading_time}} min read</span>
    </div>
    <h1>{{post_title}}</h1>
    <div class="post-tags">{{post_tags}}</div>
  </header>

  <div class="article-body">
    {{post_content}}
  </div>

  <nav class="post-pager" aria-label="Post navigation">
    {{post_pager}}
  </nav>
</article>
